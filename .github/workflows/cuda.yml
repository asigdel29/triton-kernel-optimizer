# Run CUDA correctness checks and collect a roofline on a registered Linux GPU.
name: CUDA benchmark
on: workflow_dispatch
permissions:
  contents: read
jobs:
  benchmark:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, cuda]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify GPU dependencies
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install '.[gpu,profile]'
          .venv/bin/python -c "import torch, triton; assert torch.cuda.is_available(), 'CUDA required'"
      - name: Test installed native and CUDA backends
        working-directory: ${{ runner.temp }}
        run: '"$GITHUB_WORKSPACE/.venv/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v'
      - name: Build standalone Zig kernels
        run: |
          .venv/bin/python -m pip install ziglang==0.16.0
          .venv/bin/python -m ziglang build -Doptimize=ReleaseFast
      - name: Benchmark both backends
        env:
          PYTHON: .venv/bin/python
        run: |
          bash scripts/benchmark.sh cuda benchmark-results
          zig-out/bin/kernel-bench-zig --device cuda --tokens 67 --depth 17 > benchmark-results/zig-cuda-tail.jsonl
          zig-out/bin/kernel-bench-zig --device cuda --tokens 513 --depth 64 > benchmark-results/zig-cuda.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: cuda-roofline-${{ github.sha }}-${{ github.run_id }}
          path: benchmark-results/
          if-no-files-found: error
