# Verify CPU correctness and the installed wheel on each proposed change.
name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU dependency
        run: python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Build and install wheel
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m pip install --no-deps dist/*.whl
          python -m pip check
      - run: make check PYTHON=python
      - name: Exercise installed command outside checkout
        working-directory: ${{ runner.temp }}
        run: kernel-bench --tokens 17 --repeats 1
      - name: Collect CPU baseline
        if: matrix.python == '3.12'
        run: bash scripts/benchmark.sh cpu benchmark-results
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: cpu-benchmark-${{ github.sha }}
          path: benchmark-results/
          if-no-files-found: error
