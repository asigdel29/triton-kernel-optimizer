# Verify CPU correctness and the installed wheel on each proposed change.
name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU dependency
        run: python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Build and exercise the native CPU runtime
        run: |
          python -m pip install ziglang==0.16.0
          python -m ziglang fmt --check build.zig native
          python -m ziglang build test
          python -m ziglang build -Doptimize=ReleaseFast
          zig-out/bin/kernel-bench-zig --tokens 17 --depth 13 --repeats 2
      - name: Assemble both CUDA entry points without a GPU
        if: matrix.python == '3.12'
        run: |
          python -m pip install nvidia-cuda-nvcc-cu12==12.9.86
          zig-out/bin/kernel-bench-zig --emit-ptx > native-kernels.ptx
          assembler=$(python -c 'from importlib.metadata import distribution; print(distribution("nvidia-cuda-nvcc-cu12").locate_file("nvidia/cuda_nvcc/bin/ptxas"))')
          "$assembler" -arch=sm_75 native-kernels.ptx -o native-kernels.cubin
      - name: Build and install wheel
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m pip install --no-deps dist/*.whl
          python -m pip check
      - run: make check PYTHON=python
      - name: Exercise installed command outside checkout
        working-directory: ${{ runner.temp }}
        run: kernel-bench --backend zig --tokens 17 --repeats 1
      - name: Collect CPU baseline
        if: matrix.python == '3.12'
        run: |
          bash scripts/benchmark.sh cpu benchmark-results
          zig-out/bin/kernel-bench-zig --tokens 513 --depth 64 --repeats 20 > benchmark-results/standalone.jsonl
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: cpu-benchmark-${{ github.sha }}
          path: benchmark-results/
          if-no-files-found: error
